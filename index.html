<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.V - Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#06040a] text-white h-screen flex flex-col relative bg-[url('../Background.png')] bg-cover bg-center bg-no-repeat overflow-hidden">
  <div class="absolute inset-0 bg-black/75 z-0"></div>

  <header class="relative z-20 grid grid-cols-[1fr_auto_1fr] items-center px-6 py-4 bg-[#0f0921]/90 backdrop-blur-xl border-b border-purple-500/30 shadow-[0_4px_30px_rgba(147,51,234,0.2)]">
    <div></div>
    <nav class="flex items-center gap-3">
      <a href="../index.html" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="home" class="w-4 h-4"></i>
        Home
      </a>
      <a href="browse.html" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="globe" class="w-4 h-4"></i>
        Browse
      </a>
      <a href="chat.html" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="message-square" class="w-4 h-4"></i>
        Chat
      </a>
      <a href="games.html" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-600/30 border border-purple-400/50 text-white font-bold text-xs uppercase tracking-wider shadow-[0_0_15px_rgba(168,85,247,0.3)] transition-all">
        <i data-lucide="gamepad-2" class="w-4 h-4"></i>
        Games
      </a>
      <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:bg-purple-900/40 font-bold text-xs uppercase tracking-wider transition-all">
        <i data-lucide="clapperboard" class="w-4 h-4"></i>
        Movies
      </a>
    </nav>
    <div class="flex justify-end">
      <a href="https://discord.gg/Ad9PPfB3H6" target="_blank" class="flex items-center gap-2 bg-[#5865F2]/80 hover:bg-[#5865F2] border border-[#5865F2]/50 px-4 py-2 rounded-2xl text-white font-bold text-xs uppercase tracking-wider backdrop-blur-md shadow-[0_0_20px_rgba(88,101,242,0.4)] transition-all">
        <i data-lucide="disc" class="w-4 h-4"></i>
        Discord
      </a>
    </div>
  </header>

  <main class="flex-1 p-6 relative z-10 flex flex-col max-w-7xl mx-auto w-full overflow-hidden">
    <div id="games-hub" class="flex-1 flex flex-col gap-6 overflow-hidden">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4 shrink-0">
        <h1 class="text-3xl font-black tracking-wider text-white glow-title">Game Library</h1>
        <div class="w-full md:w-80 flex items-center bg-[#0a0614]/80 border border-purple-500/40 rounded-full px-5 py-2.5 backdrop-blur-xl shadow-[0_0_20px_rgba(147,51,234,0.2)] focus-within:border-purple-400 transition-all">
          <i data-lucide="search" class="w-4 h-4 text-purple-400 mr-3"></i>
          <input id="game-search" type="text" placeholder="Search games..." class="bg-transparent w-full outline-none text-sm text-purple-100 placeholder-purple-500/50 font-medium tracking-wide">
        </div>
      </div>

      <div id="games-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 p-2 no-scrollbar">
        <div class="col-span-full flex items-center justify-center h-64">
          <div class="flex items-center gap-3 text-purple-400 text-lg font-bold animate-pulse">
            <i data-lucide="loader" class="w-6 h-6 animate-spin"></i>
            Loading Games from Seraph, Truffled, UGS & CKV...
          </div>
        </div>
      </div>
    </div>

    <div id="game-viewport" class="absolute inset-6 z-30 bg-[#06040a]/95 border border-purple-500/40 rounded-3xl backdrop-blur-2xl shadow-[0_0_60px_rgba(147,51,234,0.4)] flex flex-col hidden overflow-hidden">
      <header class="flex items-center justify-between px-6 py-4 bg-[#0f0921]/80 border-b border-purple-500/30 shrink-0">
        <div class="flex items-center gap-3">
          <button id="btn-close-game" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-purple-600/30 border border-purple-400/50 hover:bg-purple-600/60 text-white font-bold text-xs uppercase tracking-wider transition-all">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Library
          </button>
          <span id="game-title-display" class="text-base font-black tracking-wider text-white"></span>
        </div>
        <button id="btn-game-fullscreen" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-purple-950/60 border border-purple-500/40 hover:bg-purple-600/40 text-purple-200 hover:text-white font-bold text-xs uppercase tracking-wider transition-all">
          <i data-lucide="maximize" class="w-4 h-4"></i>
          Fullscreen
        </button>
      </header>
      <iframe id="game-frame" class="w-full flex-1 border-none bg-black" src=""></iframe>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const gamesGrid = document.getElementById('games-grid');
      const gameSearch = document.getElementById('game-search');
      const gameViewport = document.getElementById('game-viewport');
      const gameFrame = document.getElementById('game-frame');
      const gameTitleDisplay = document.getElementById('game-title-display');
      const btnCloseGame = document.getElementById('btn-close-game');
      const btnGameFullscreen = document.getElementById('btn-game-fullscreen');

      let allGames = [];

      function buildGameUrl(item, sourceBase) {
        let url = item.url || item.link || item.path || '';
        if (!url) return '';
        if (/^https?:\/\//.test(url)) return url;
        if (/^\/\//.test(url)) return 'https:' + url;
        url = url.replace(/^\/+/, '');
        url = url.replace(/\.json$/, '.html');
        return `${sourceBase}/${url}`;
      }

      function buildImageUrl(item, sourceBase, sourceName) {
        let img = item.img || item.image || item.cover || item.icon || '';
        if (/^https?:\/\//.test(img)) return img;
        if (/^\/\//.test(img)) return 'https:' + img;
        if (img) {
          img = img.replace(/^\/+/, '');
          return `${sourceBase}/${img}`;
        }
        const fallbackId = item.id || item.slug || 'game';
        return `${sourceBase}/icons/${fallbackId}.png`;
      }

      async function fetchCatalog(url) {
        try {
          const res = await fetch(url);
          if (!res.ok) return [];
          const data = await res.json();
          return Array.isArray(data) ? data : (data.games || data.items || []);
        } catch (e) {
          return [];
        }
      }

      async function loadAllCatalogs() {
        const sources = [
          { name: 'seraph', catalog: 'https://cdn.jsdelivr.net/gh/gmshelf/seraph/seraph.json', base: 'https://cdn.jsdelivr.net/gh/gmshelf/seraph' },
          { name: 'truffled', catalog: 'https://cdn.jsdelivr.net/gh/gmshelf/truffled/truffled.json', base: 'https://cdn.jsdelivr.net/gh/gmshelf/truffled' },
          { name: 'ugs', catalog: 'https://cdn.jsdelivr.net/gh/gmshelf/ugs/ugs.json', base: 'https://cdn.jsdelivr.net/gh/gmshelf/ugs' },
          { name: 'ckv', catalog: 'https://cdn.jsdelivr.net/gh/gmshelf/ckv/ckv.json', base: 'https://cdn.jsdelivr.net/gh/gmshelf/ckv' }
        ];

        const results = await Promise.all(sources.map(s => fetchCatalog(s.catalog)));
        const combined = [];

        results.forEach((list, idx) => {
          const source = sources[idx];
          list.forEach(item => {
            const gameUrl = buildGameUrl(item, source.base);
            const imageUrl = buildImageUrl(item, source.base, source.name);

            if (gameUrl) {
              combined.push({
                title: item.title || item.name || 'Untitled',
                url: gameUrl,
                img: imageUrl
              });
            }
          });
        });

        allGames = combined;
        renderGames(allGames);
      }

      function renderGames(games) {
        if (!gamesGrid) return;
        gamesGrid.innerHTML = '';

        if (games.length === 0) {
          gamesGrid.innerHTML = '<div class="col-span-full flex items-center justify-center h-64 text-purple-400 font-bold text-base">No games found.</div>';
          return;
        }

        games.forEach(game => {
          const card = document.createElement('div');
          card.className = 'group flex flex-col bg-[#0f0921]/60 border border-purple-500/20 hover:border-purple-400/60 rounded-2xl p-3 backdrop-blur-md shadow-[0_4px_20px_rgba(147,51,234,0.15)] hover:shadow-[0_0_30px_rgba(147,51,234,0.25)] cursor-pointer transition-all duration-200';

          const imgContainer = document.createElement('div');
          imgContainer.className = 'w-full aspect-square rounded-xl bg-[#06040a]/80 overflow-hidden relative border border-purple-500/20 mb-3';

          const img = document.createElement('img');
          img.className = 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-300';
          img.src = game.img;
          img.alt = game.title;
          img.onerror = () => {
            img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="%239333ea" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 8h8v8H8z"/><path d="M8 16l8-8"/></svg>';
          };

          imgContainer.appendChild(img);

          const title = document.createElement('h2');
          title.className = 'text-xs font-bold text-purple-100 group-hover:text-white truncate tracking-wide text-center';
          title.textContent = game.title;

          card.appendChild(imgContainer);
          card.appendChild(title);
          card.addEventListener('click', () => openGame(game));
          gamesGrid.appendChild(card);
        });

        if (window.lucide) lucide.createIcons();
      }

      function openGame(game) {
        if (!game || !game.url) return;
        if (gameTitleDisplay) gameTitleDisplay.textContent = game.title;
        if (gameFrame) {
          gameFrame.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-popups allow-presentation');
          gameFrame.src = game.url;
        }
        if (gameViewport) gameViewport.classList.remove('hidden');
      }

      if (btnCloseGame) {
        btnCloseGame.addEventListener('click', () => {
          if (gameViewport) gameViewport.classList.add('hidden');
          if (gameFrame) gameFrame.src = '';
        });
      }

      if (btnGameFullscreen) {
        btnGameFullscreen.addEventListener('click', () => {
          if (gameViewport) {
            if (!document.fullscreenElement) {
              gameViewport.requestFullscreen().catch(() => {});
            } else {
              document.exitFullscreen();
            }
          }
        });
      }

      if (gameSearch) {
        gameSearch.addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase().trim();
          const filtered = allGames.filter(g => g.title.toLowerCase().includes(q));
          renderGames(filtered);
        });
      }

      loadAllCatalogs();
    });
  </script>
</body>
</html>
